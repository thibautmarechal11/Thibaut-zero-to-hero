<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Crete+Round:ital@0;1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="script" href="script.js">
        <title>Page d'Accueil</title>
    </head>
    <body>
        <section id ="about" class="container-fluid">
            <div class="col-8 col-lg-4 profile-picture">
                <img src="ASSETS/Marechal_Thibaut_Photo.jpg" alt="Photo de Thibaut Maréchal" class="rounded-circle" style="width:400px">
            </div>
            <div class="heading">
                <h1>Thibaut Maréchal</h1>
                <h2>Future Ingénieur Informatique et Numérique</h2>
                <a class="btn btn-outline-light button-1" href="">Télécharger mon CV</a>
            </div>
        </section>
        <section id="skills" class="container-fluid row">
            <h3>Compétences</h3>
            <div class="col-lg-4">
                <h4>Conception</h4>
                <ul class="list-group list-group-flush skills-list">
                    <li class="list-group-item">Figma</li>
                    <li class="list-group-item">Office 365</li>
                    <li class="list-group-item">Suite Adobe (Photoshop, Illustrator)</li>
                </ul>
            </div>
            <div class="col-lg-4">
                <h4>Développement</h4>
                <ul class="list-group list-group-flush skills-list">
                    <li class="list-group-item">C#</li>
                    <li class="list-group-item">HTML5</li>
                    <li class="list-group-item">CSS3</li>
                    <li class="list-group-item">JavaScript</li>
                    <li class="list-group-item">Python</li>
                    <li class="list-group-item">SQL</li>
                </ul>
            </div>
            <div class="col-lg-4">
                <h4>Outils</h4>
                <ul class="list-group list-group-flush skills-list">
                    <li class="list-group-item">Visual Studio</li>
                    <li class="list-group-item">Git & GitHub</li>
                </ul>
            </div>
        </section>
    </body>
</html>
