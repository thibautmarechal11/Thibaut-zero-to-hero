<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Spotify Clone</title>
</head>
<body>
    <div class="container">
        <header class="TopBar">
            <div class="topbar-left">
                <img src="" alt="LOGO">
            </div>
            <div class="topbar-center">
                <input type="button" placeholder="home">
                <input id="search-input" type="text" placeholder="search">
            </div>
            <div class="topbar-right">
                <a href="">Installer l'appli</a>
                <input type="button" img src="" alt="notification">
                <input type="button" img src="" alt="community">
                <input type="button" img src="" alt="profile">
            </div>
        </header>
        <aside class="Library">
            <div class="libraryheader">
                <div class="lib-left">
                    <input type="image" src="" alt="icone reduire">
                    <input type="button" value="Bibliothèque">
                </div>
                <div class="lib-right">
                    <input type="button" value="+ Créer">
                    <input type="image" src="" alt="agrandir">
                </div>
            </div>
            <div class="playlist-list">
                <div class="playlist-item" id="playlist 1">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 1</p>
                </div>
                <div class="playlist-item" id="playlist 2">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 2</p>
                </div>
                <div class="playlist-item" id="playlist 3">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 3</p>
                </div>
                <div class="playlist-item" id="playlist 4">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 4</p>
                </div>
                <div class="playlist-item" id="playlist 5">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 5</p>
                </div>
                <div class="playlist-item" id="playlist 6">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 6</p>
                </div>
                <div class="playlist-item" id="playlist 7">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 7</p>
                </div>
                <div class="playlist-item" id="playlist 8">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 8</p>
                </div>
                <div class="playlist-item" id="playlist 9">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 9</p>
                </div>
                <div class="playlist-item" id="playlist 10">
                    <img src="" alt="photo-playlist">
                    <p>Playlist 10</p>
                </div>
                
            </div>
        </aside>
        <main class="MainContent">
            <div class="card-grid">
                <div class="card">
                    <img src="http://placeholder.co/300" alt="Couverture Albulm">
                    <h3>Daily Mix 1</h3>
                    <p>Artist</p>
                </div>
                <div class="card">
                    <img src="http://placeholder.co/300" alt="Couverture Albulm">
                    <h3>Daily Mix 1</h3>
                    <p>Artist</p>
                </div>
                <div class="card">
                    <img src="http://placeholder.co/300" alt="Couverture Albulm">
                    <h3>Daily Mix 1</h3>
                    <p>Artist</p>
                </div>
                <div class="card">
                    <img src="http://placeholder.co/300" alt="Couverture Albulm">
                    <h3>Daily Mix 1</h3>
                    <p>Artist</p>
                </div>
            </div>
        </main>
        <aside class="Preview">

        </aside>
        <footer class="PlayerBar">
            <div class="player-left">
                <img src="" alt="coverAlbum">
                <div class="player-info">
                    <h4 id="current-song-title">Titre</h4>
                    <p id="current-song-artist">Artiste</p>
                </div>
            </div>
            <div class="player-center">
                <div class="player-controls">
                    <input class="repeat-button" type="button" value="🔀">
                    <input class="backward-button" type="button" value="⏮️">
                    <input class="play-button" type="button" value="▶️">
                    <input class="forward-button" type="button" value="⏭️">
                    <input class="shuffle-button" type="button" value="🔁">
                </div>
                <div class="player-progress">
                    <input class="progress-bar" type="range">
                </div>
            </div>
            <div class="player-right">
                <input class="volume-button" type="button" value="🔈">
                <input class="volume-bar" type="range" >
            </div>
        </footer>

    </div>
    <script src="script.js"></script>
</body>
